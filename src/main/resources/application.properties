spring.application.name=eventpro

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/eventpro_db
spring.datasource.username=eventpro
spring.datasource.password=eventpro
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true

# Database initialization
spring.jpa.open-in-view=false


logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.engine.jdbc.env.internal=DEBUG