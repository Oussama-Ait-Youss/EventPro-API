services:

  # ==================================
  # EVENTPRO DATABASE
  # ==================================
  postgres:
    image: postgres:17.4
    container_name: postgres
    environment:
      POSTGRES_USER: eventpro
      POSTGRES_PASSWORD: eventpro
      POSTGRES_DB: eventpro_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpro -d eventpro_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - eventpro-net
    restart: unless-stopped

  # ==================================
  # PGADMIN
  # ==================================
  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventpro-net
    restart: unless-stopped

  # ==================================
  # SONARQUBE DATABASE
  # ==================================
  sonar-db:
    image: postgres:17.4
    container_name: sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_password
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - eventpro-net
    restart: unless-stopped

  # ==================================
  # SONARQUBE
  # ==================================
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_password
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - eventpro-net
    restart: unless-stopped

  # ==================================
  # JENKINS (JAVA 21 + DOCKER CLI)
  # ==================================
  jenkins:
    build:
      context: .
      dockerfile: docker.jenkins
    image: eventpro-jenkins:jdk21
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sonarqube:
        condition: service_healthy
    networks:
      - eventpro-net
    restart: unless-stopped

  # ==================================
  # NGROK (WEBHOOK TUNNEL FOR JENKINS)
  # ==================================
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    command:
      - "http"
      - "jenkins:8080"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - jenkins
    networks:
      - eventpro-net
    restart: unless-stopped

volumes:
  postgres_data:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  jenkins_home:

networks:
  eventpro-net:
    driver: bridge